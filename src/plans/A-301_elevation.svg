 proposed AC requirement.</text><text x="64" y="973" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#ac5b49">NOT FOR CONSTRUCTION • SCHEMATIC ONLY • ALL DIMENSIONS, SETBACKS, LEVELS AND QUANTITIES REQUIRE SURVEY + CONSULTANT VERIFICATION</text></svg>