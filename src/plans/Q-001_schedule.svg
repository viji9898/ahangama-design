ineer to verify load/startup</text><rect x="60" y="759" width="1280" height="25" fill="white" stroke="#d8e2e3" stroke-width="0.6" rx="0"/><text x="66" y="776" font-family="Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#263843">Water heaters</text><text x="286" y="776" font-family="Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#263843">4 × 50 L</text><text x="535" y="776" font-family="Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#263843">4 no.</text><text x="765" y="776" font-family="Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#263843">Pressure-rated, storage sizing TBC</text><rect x="48" y="818" width="1304" height="121" fill="#f4f7f6" stroke="#c5d2d4"/><text x="66" y="840" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#263843">MEASUREMENT / COORDINATION NOTES</text><text x="66" y="861" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">The drawings do not constitute a measured BOQ; discrepancies are flagged deliberately.</text><text x="66" y="880" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">QS to reconcile historic cost-plan quantities against a coordinated architectural model.</text><text x="66" y="899" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">No foundations, reinforcement, MEP pipe runs or utility service routes are dimensioned.</text><text x="66" y="918" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">Use accompanying cost workbook V13 as pricing reference, not construction specification.</text><text x="64" y="973" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#ac5b49">NOT FOR CONSTRUCTION • SCHEMATIC ONLY • ALL DIMENSIONS, SETBACKS, LEVELS AND QUANTITIES REQUIRE SURVEY + CONSULTANT VERIFICATION</text></svg>