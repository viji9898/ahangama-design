, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#263843">Building footprint: 112 m²</text><text x="830" y="351" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#263843">Footprint / plot: 22.1%</text><text x="830" y="384" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#263843">Unbuilt area: ~393.9 m²</text><text x="830" y="435" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#263843">Items to measure after survey:</text><text x="842" y="467" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#263843">• External stair footprint and landing</text><text x="842" y="497" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#263843">• Parking / pathways / paving</text><text x="842" y="527" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#263843">• Fencing, gate and landscaping</text><text x="842" y="557" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#263843">• Generator, water tank and wastewater</text><text x="842" y="587" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#263843">• Setbacks, boundaries, utilities, levels</text><rect x="48" y="818" width="1304" height="121" fill="#f4f7f6" stroke="#c5d2d4"/><text x="66" y="840" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#263843">MEASUREMENT / COORDINATION NOTES</text><text x="66" y="861" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">Plot shape, road frontage, north and setback lines are illustrative only.</text><text x="66" y="880" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">20 perches = 505.86 m²; 22 × 23 m is an area-equivalent sketch, not a survey.</text><text x="66" y="899" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">Allow space for approved wastewater disposal, utility access and generator acoustics.</text><text x="66" y="918" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">QS: site works quantities to remain provisional until surveyed layout is issued.</text><text x="64" y="973" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#ac5b49">NOT FOR CONSTRUCTION • SCHEMATIC ONLY • ALL DIMENSIONS, SETBACKS, LEVELS AND QUANTITIES REQUIRE SURVEY + CONSULTANT VERIFICATION</text></svg>