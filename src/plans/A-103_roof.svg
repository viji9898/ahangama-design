idth="0.8" /><line x1="666.6666666666667" y1="240" x2="666.6666666666667" y2="670.0" stroke="#c59d83" stroke-width="0.8" /><line x1="723.9999999999999" y1="240" x2="723.9999999999999" y2="670.0" stroke="#c59d83" stroke-width="0.8" /><line x1="781.3333333333334" y1="240" x2="781.3333333333334" y2="670.0" stroke="#c59d83" stroke-width="0.8" /><line x1="838.6666666666666" y1="240" x2="838.6666666666666" y2="670.0" stroke="#c59d83" stroke-width="0.8" /><line x1="895.9999999999999" y1="240" x2="895.9999999999999" y2="670.0" stroke="#c59d83" stroke-width="0.8" /><line x1="953.3333333333334" y1="240" x2="953.3333333333334" y2="670.0" stroke="#c59d83" stroke-width="0.8" /><line x1="1010.6666666666666" y1="240" x2="1010.6666666666666" y2="670.0" stroke="#c59d83" stroke-width="0.8" /><line x1="208" y1="200" x2="1068.0" y2="200" stroke="#61727b" stroke-width="1.4" /><line x1="208" y1="195" x2="208" y2="205" stroke="#61727b" stroke-width="1.4" /><line x1="1068.0" y1="195" x2="1068.0" y2="205" stroke="#61727b" stroke-width="1.4" /><text x="638.0" y="192" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#263843">17,200 mm including 600 mm gable overhang each end</text><line x1="169" y1="235" x2="169" y2="675.0" stroke="#61727b" stroke-width="1.4" /><line x1="164" y1="235" x2="174" y2="235" stroke="#61727b" stroke-width="1.4" /><line x1="164" y1="675.0" x2="174" y2="675.0" stroke="#61727b" stroke-width="1.4" /><text x="184" y="455.0" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#263843" transform="rotate(90 184 455.0)">8,800 mm including 900 mm eaves each side</text><text x="1100" y="268" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#263843">AREA TAKEOFF</text><text x="1080" y="303" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#263843">Plan: 17.2 × 8.8 = 151.36 m²</text><text x="1080" y="338" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#263843">Pitch: 30°</text><text x="1080" y="373" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#263843">Slope factor: 1.1547</text><text x="1080" y="408" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#263843">Roof slope: 174.8 m²</text><text x="1080" y="443" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#263843">Budget quantity: 175 m²</text><text x="1080" y="478" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#263843">Gutters: 34.4 linear m</text><text x="1080" y="513" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#263843">Downpipes: 4 sets</text><text x="280" y="738" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#263843">ROOF: TERRACOTTA CLAY TILES + TREATED TIMBER + FOIL + INSULATION</text><rect x="48" y="818" width="1304" height="121" fill="#f4f7f6" stroke="#c5d2d4"/><text x="66" y="840" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#263843">MEASUREMENT / COORDINATION NOTES</text><text x="66" y="861" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">Roof projection 17.2 × 8.8 m and slope area 174.8 m²; allow 175 m² for initial pricing.</text><text x="66" y="880" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">Timber roof structure, truss layout, tile fixing and wind uplift anchorage are not engineered.</text><text x="66" y="899" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">Allow 34.4 m gutters, 4 downpipe sets, flashings and ventilated/insulated roof buildup.</text><text x="66" y="918" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">No open-to-sky terrace; all first-floor space is covered by the roof.</text><text x="64" y="973" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#ac5b49">NOT FOR CONSTRUCTION • SCHEMATIC ONLY • ALL DIMENSIONS, SETBACKS, LEVELS AND QUANTITIES REQUIRE SURVEY + CONSULTANT VERIFICATION</text></svg>