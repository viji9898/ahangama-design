stroke="#d7b58a" stroke-width="1.5" rx="8"/><text x="926" y="569.05" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263843">LOUNGE SEATING</text><rect x="1101" y="332.5" width="71.25" height="228" fill="#e5d1ad" stroke="#d7b58a" stroke-width="2" rx="0"/><text x="1141" y="446.5" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#263843" transform="rotate(90 1141 446.5)">STAIR</text><line x1="185" y1="215" x2="1097" y2="215" stroke="#61727b" stroke-width="1.4" /><line x1="185" y1="210" x2="185" y2="220" stroke="#61727b" stroke-width="1.4" /><line x1="1097" y1="210" x2="1097" y2="220" stroke="#61727b" stroke-width="1.4" /><text x="641.0" y="207" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#263843">16,000 mm</text><line x1="148" y1="247" x2="148" y2="646" stroke="#61727b" stroke-width="1.4" /><line x1="143" y1="247" x2="153" y2="247" stroke="#61727b" stroke-width="1.4" /><line x1="143" y1="646" x2="153" y2="646" stroke="#61727b" stroke-width="1.4" /><text x="163" y="446.5" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#263843" transform="rotate(90 163 446.5)">7,000 mm</text><text x="1110" y="279" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#263843">VENTILATION / AC</text><text x="1100" y="315" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#263843">• Open-sided perimeter</text><text x="1100" y="349" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#263843">• Deep roof eaves</text><text x="1100" y="383" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#263843">• 4 ceiling fans allowed</text><text x="1100" y="417" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#263843">• 2 split AC units proposed</text><text x="1100" y="451" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#263843">• AC enclosure NOT designed</text><text x="1100" y="485" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#263843">• Conditioned area TBD</text><text x="220" y="708" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#263843">FIRST-FLOOR WATERPROOFING ALLOWANCE: 112 m² (FULL SLAB)</text><rect x="48" y="818" width="1304" height="121" fill="#f4f7f6" stroke="#c5d2d4"/><text x="66" y="840" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#263843">MEASUREMENT / COORDINATION NOTES</text><text x="66" y="861" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">Full 112 m² slab covered by pitched roof; open sides remain exposed to wind-driven rain.</text><text x="66" y="880" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">Two first-floor split AC units are in budget but require a defined enclosed, conditioned zone.</text><text x="66" y="899" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">Kitchen cabinetry, sink, appliances and drainage need coordination with MEP schedules.</text><text x="66" y="918" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">Balustrade length and positions are provisional; measure exposed edges after stair/enclosure design.</text><text x="64" y="973" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#ac5b49">NOT FOR CONSTRUCTION • SCHEMATIC ONLY • ALL DIMENSIONS, SETBACKS, LEVELS AND QUANTITIES REQUIRE SURVEY + CONSULTANT VERIFICATION</text></svg>