if" font-size="12" font-weight="400" text-anchor="start" fill="#263843">RC first-floor slab and exposed underside, timber gable roof with insulation above.</text><text x="66" y="899" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">Ground-floor bath and concrete bed platform illustrated, not coordinated construction details.</text><text x="66" y="918" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263843">Full upper-floor waterproofing assumed due to wind-driven rain; provide falls and drainage.</text><text x="64" y="973" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#ac5b49">NOT FOR CONSTRUCTION • SCHEMATIC ONLY • ALL DIMENSIONS, SETBACKS, LEVELS AND QUANTITIES REQUIRE SURVEY + CONSULTANT VERIFICATION</text></svg>